services:
  - type: web
    name: clinicpro-iraq
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run db:generate && npm run build -w @iraq-clinic/clinic-system
    startCommand: node scripts/deploy-start.js
    healthCheckPath: /ar
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_OUTPUT
        value: standalone
      - key: DATABASE_URL
        fromDatabase:
          name: clinicpro-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: clinicpro-db
    databaseName: clinicpro
    plan: free
    region: oregon
